<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="icon" type="image/png" href="%sveltekit.assets%/pele-logo.png" />
		<script>
			// Apply the saved theme before first paint to avoid a flash.
			try {
				var t = localStorage.getItem('pele-live:theme');
				if (t === 'light') t = 'day';
				else if (t === 'dark') t = 'matte';
				// Only known themes may set the attribute; anything else falls
				// through to 'auto' (media queries) via the missing attribute.
				if (['day', 'paper', 'midnight', 'matte'].indexOf(t) < 0) t = null;
				if (t) document.documentElement.dataset.theme = t;
			} catch (e) {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
